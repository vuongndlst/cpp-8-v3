name: Check Gemini workshop demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: workshop-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check source
        run: |
          node --check workshop/server.cjs
          node --check workshop/launcher.js
          node --check runtime/cpp/engine/practice-feedback.js

      - name: Check demo with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node workshop/check.cjs
